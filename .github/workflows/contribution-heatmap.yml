name: Contribution Heatmap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using GraphQL contribution fetcher"
          head -10 scripts/fetch_contributions.py
          python scripts/fetch_contributions.py

      - name: Generate heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution heatmap"
          file_pattern: |
            data/contributions.json
            profile/contribution-heatmap.svg