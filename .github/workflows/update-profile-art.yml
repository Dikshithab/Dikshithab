name: Update GitHub Contribution Heatmap

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Generate heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Save updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution heatmap"
          file_pattern: |
            data/contributions.json
            profile/contribution-heatmap.svg