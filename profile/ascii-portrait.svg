<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="220"
     viewBox="0 0 700 220">

  <style>
    .ascii {
      fill: #39d353;
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
    }

    .name {
      fill: #58a6ff;
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
    }

    .sub {
      fill: #8b949e;
      font-family: monospace;
      font-size: 13px;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .portrait {
      animation: appear 1.5s ease-out forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="#0d1117"/>

  <!-- Terminal prompt -->
  <text x="25" y="30"
        class="sub">
    shiva@github:~$ cat developer.txt
  </text>

  <!-- ASCII portrait -->
  <g class="portrait">

    <text x="25" y="65" class="ascii">
      ███████████████████
    </text>

    <text x="25" y="82" class="ascii">
      █████████████████████
    </text>

    <text x="25" y="99" class="ascii">
      ███      █████      ███
    </text>

    <text x="25" y="116" class="ascii">
      ███     ███████     ███
    </text>

    <text x="25" y="133" class="ascii">
      ███       █       ███
    </text>

    <text x="25" y="150" class="ascii">
      ███      █████     ███
    </text>

    <text x="25" y="167" class="ascii">
      █████████████████████
    </text>

    <text x="25" y="184" class="ascii">
      ███████████████████
    </text>

  </g>

  <!-- Information -->
  <text x="330" y="78"
        class="name">
    SHIVA DIKSHITHA
  </text>

  <text x="330" y="108"
        class="sub">
    Full Stack Developer
  </text>

  <text x="330" y="135"
        class="sub">
    Python • Django • React • AI
  </text>

  <text x="330" y="162"
        class="sub">
    Building intelligent applications
  </text>

  <text x="330" y="190"
        class="ascii">
    &gt; keep_building<span class="blink">_</span>
  </text>

</svg>