        font-size="15">
    $ projects
  </text>

  <text x="485" y="115"
        class="blue"
        font-size="14">
    01  HireSphere
  </text>

  <text x="485" y="137"
        class="muted"
        font-size="12">
    AI-powered job platform
  </text>

  <text x="485" y="170"
        class="blue"
        font-size="14">
    02  AI-Kanban
  </text>

  <text x="485" y="192"
