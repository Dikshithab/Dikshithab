<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="360"
     viewBox="0 0 900 360">

  <style>
    .bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 2;
    }

    .terminal {
      fill: #161b22;
    }

    .text {
      fill: #c9d1d9;
      font-family: monospace;
    }

    .green {
      fill: #39d353;
      font-family: monospace;
    }

    .blue {
      fill: #58a6ff;
      font-family: monospace;
    }

    .purple {
      fill: #bc8cff;
      font-family: monospace;
    }

    .muted {
      fill: #8b949e;
      font-family: monospace;
    }

    .cursor {
      fill: #39d353;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .line {
      opacity: 0;
      animation: show 0.5s forwards;
    }

    .l1 { animation-delay: .2s; }
    .l2 { animation-delay: .5s; }
    .l3 { animation-delay: .8s; }
    .l4 { animation-delay: 1.1s; }
    .l5 { animation-delay: 1.4s; }
    .l6 { animation-delay: 1.7s; }

    @keyframes show {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>

  <!-- Main terminal -->
  <rect x="5" y="5" width="890" height="350"
        rx="16" class="bg"/>

  <!-- Terminal header -->
  <rect x="5" y="5" width="890" height="42"
        rx="16" class="terminal"/>

  <!-- Window buttons -->
  <circle cx="30" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="26" r="6" fill="#27c93f"/>

  <text x="105" y="31"
        class="muted"
        font-size="14">
    shiva@github — developer-terminal
  </text>

  <!-- Left side -->
  <text x="35" y="82"
        class="green"
        font-size="15">
    shiva@github:~$
  </text>

  <text x="175" y="82"
        class="text"
        font-size="15">
    whoami
  </text>

  <text x="35" y="112"
        class="blue"
        font-size="22"
        font-weight="bold">
    SHIVA DIKSHITHA
  </text>

  <text x="35" y="137"
        class="muted"
        font-size="14">
    Full Stack Developer
  </text>

  <text x="35" y="170"
        class="green"
        font-size="14">
    $ stack
  </text>

  <text x="35" y="195"
        class="text"
        font-size="13">
    Backend
  </text>

  <text x="135" y="195"
        class="purple"
        font-size="13">
    Python • Django • DRF
  </text>

  <text x="35" y="218"
        class="text"
        font-size="13">
    Frontend
  </text>

  <text x="135" y="218"
        class="blue"
        font-size="13">
    React • JavaScript
  </text>

  <text x="35" y="241"
        class="text"
        font-size="13">
